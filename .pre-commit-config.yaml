default_language_version:
  python: python3

repos:
  # 1. Structural file-system hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 2. Prettier configuration for Web and Config ecosystems
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Using explicit regex extensions to bypass localized system environment type conflicts
        files: '\.(js|jsx|ts|tsx|json|yaml|yml|md|html|css)$'

  # 3. Rust-backed Ruff engine for Python ecosystem coverage
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix] # Automatically patches safe lint errors on commit evaluations
      - id: ruff-format # Replaces Black with ultra-rapid formatting
